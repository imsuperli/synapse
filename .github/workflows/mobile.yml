name: Mobile

on:
  workflow_dispatch:
    inputs:
      build_android_apk:
        description: 'Build a downloadable Android APK artifact'
        required: false
        default: true
        type: boolean
  pull_request:
    paths:
      - 'mobile/**'
      - 'src/shared/remote/**'
      - '.github/workflows/mobile.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
      - test-build-*
    paths:
      - 'mobile/**'
      - 'src/shared/remote/**'
      - '.github/workflows/mobile.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Upgrade npm to v11
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.11.1

      - name: Install desktop dependencies
        run: npm ci --ignore-scripts

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Typecheck mobile
        run: npm run mobile:typecheck

      - name: Test mobile
        run: npm run mobile:test

      - name: Verify Synapse Mobile identity
        run: npm run mobile:verify:identity

  build-android-apk:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_android_apk }}
    needs: validate-mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Upgrade npm to v11
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.11.1

      - name: Install desktop dependencies
        run: npm ci --ignore-scripts

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Verify Synapse Mobile identity
        run: npm run mobile:verify:identity

      - name: Build Android APK
        run: npm run mobile:build:android-apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: synapse-mobile-android-apk
          path: mobile/dist/android/*.apk
          if-no-files-found: error
          retention-days: 7
